<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wissellijst - Inloggen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #121212; color: #e0e0e0;
            max-width: 400px; margin: 0 auto; padding: 60px 20px;
        }
        h1 { color: #1db954; margin-bottom: 24px; font-size: 1.6em; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 20px; }
        label { display: block; color: #b3b3b3; font-size: 0.85em; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px 12px; border: 1px solid #333;
            border-radius: 6px; background: #2a2a2a; color: #e0e0e0;
            font-size: 0.95em; margin-bottom: 12px; font-family: inherit;
        }
        input:focus { border-color: #1db954; outline: none; }
        .btn {
            display: inline-block; padding: 10px 20px; border: none; border-radius: 6px;
            font-size: 0.95em; cursor: pointer; font-weight: 600;
            background: #1db954; color: #000; width: 100%;
        }
        .btn:hover { background: #1ed760; }
        .fout { background: #3a1a1a; color: #e74c3c; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Wissellijst</h1>
    <div class="card">
        {% if fout %}<div class="fout">{{ fout }}</div>{% endif %}
        <form method="post" action="/auth/login">
            <label for="wachtwoord">Wachtwoord</label>
            <input type="password" id="wachtwoord" name="wachtwoord" autofocus autocomplete="current-password">
            <button class="btn" type="submit">Inloggen</button>
        </form>
    </div>
</body>
</html>
